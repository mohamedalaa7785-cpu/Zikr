<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A2A1E" />
    <title>بدون اتصال - ذِكرٌ</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial,
          sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji';
        background: linear-gradient(135deg, #071c20 0%, #0a2a1e 100%);
        color: #d4a574;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        max-width: 500px;
        text-align: center;
      }

      .icon {
        width: 100px;
        height: 100px;
        margin: 0 auto 30px;
        opacity: 0.8;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 15px;
        color: #d4a574;
        font-weight: 600;
      }

      p {
        font-size: 16px;
        line-height: 1.6;
        color: rgba(212, 165, 116, 0.8);
        margin-bottom: 30px;
      }

      .status {
        display: inline-block;
        padding: 12px 20px;
        background: rgba(212, 165, 116, 0.1);
        border: 1px solid rgba(212, 165, 116, 0.3);
        border-radius: 8px;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .status.offline {
        color: #ef4444;
        border-color: #ef4444;
        background: rgba(239, 68, 68, 0.1);
      }

      .status.online {
        color: #10b981;
        border-color: #10b981;
        background: rgba(16, 185, 129, 0.1);
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      a {
        display: inline-block;
        padding: 12px 24px;
        background: #d4a574;
        color: #071c20;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 500;
        transition: all 0.3s ease;
        cursor: pointer;
        border: none;
      }

      a:hover {
        background: #e8b88a;
        transform: translateY(-2px);
      }

      .secondary {
        background: transparent;
        color: #d4a574;
        border: 1px solid #d4a574;
      }

      .secondary:hover {
        background: rgba(212, 165, 116, 0.1);
      }

      .cached-content {
        margin-top: 40px;
        padding-top: 30px;
        border-top: 1px solid rgba(212, 165, 116, 0.2);
      }

      .cached-content h2 {
        font-size: 16px;
        margin-bottom: 15px;
        color: rgba(212, 165, 116, 0.7);
      }

      .cached-links {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .cached-links a {
        padding: 10px 12px;
        font-size: 13px;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      @media (max-width: 600px) {
        h1 {
          font-size: 24px;
        }

        p {
          font-size: 14px;
        }

        .icon {
          width: 80px;
          height: 80px;
        }

        .cached-links {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <svg
        class="icon"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.5"
          d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"
        ></path>
      </svg>

      <h1>أنت غير متصل بالإنترنت</h1>

      <p>يبدو أن الاتصال بالإنترنت غير متوفر حالياً. لكن لا تقلق - يمكنك الوصول إلى المحتوى المخزن مسبقاً.</p>

      <div class="status offline" id="status">
        <span id="status-text">⏳ انتظر جاري التحقق من الاتصال...</span>
      </div>

      <div class="links">
        <a href="/">← العودة إلى الصفحة الرئيسية</a>
        <a href="/quran" class="secondary">القرآن الكريم</a>
      </div>

      <div class="cached-content">
        <h2>محتوى متاح بدون اتصال</h2>
        <div class="cached-links">
          <a href="/adhkar">الأذكار</a>
          <a href="/dua">الأدعية</a>
          <a href="/tasbeeh">التسبيح</a>
          <a href="/settings">الإعدادات</a>
          <a href="/about">عن ذِكرٌ</a>
          <a href="/privacy">سياسة الخصوصية</a>
        </div>
      </div>
    </div>

    <script>
      // Update connection status
      function updateStatus() {
        const statusEl = document.getElementById('status-text');
        const statusDiv = document.getElementById('status');
        if (navigator.onLine) {
          statusDiv.className = 'status online';
          statusEl.textContent = '✓ عاد الاتصال - يمكنك تحديث الصفحة';
          // Auto-reload after 3 seconds
          setTimeout(() => {
            window.location.reload();
          }, 3000);
        } else {
          statusDiv.className = 'status offline';
          statusEl.textContent = '✗ لا يزال غير متصل';
        }
      }

      // Check status immediately
      updateStatus();

      // Listen for online event
      window.addEventListener('online', updateStatus);
      window.addEventListener('offline', updateStatus);
    </script>
  </body>
</html>
