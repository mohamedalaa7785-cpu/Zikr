version: 2.1

parameters:
  run_automation:
    type: boolean
    default: false

jobs:
  verify:
    docker:
      - image: cimg/node:22.13
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Enable pnpm
          command: |
            sudo corepack enable
            corepack prepare pnpm@9.15.0 --activate
            pnpm --version
      - restore_cache:
          keys:
            - zikr-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - zikr-pnpm-v1-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: zikr-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      - run:
          name: Run full verification suite
          command: pnpm verify
          no_output_timeout: 20m

  production-smoke:
    docker:
      - image: cimg/node:22.13
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify production deployment matches this commit
          command: |
            set -euo pipefail
            for attempt in $(seq 1 15); do
              if EXPECTED_COMMIT_SHA="${CIRCLE_SHA1}" node scripts/smoke-production-routes.mjs "https://zikrmediaofficial.vercel.app"; then
                exit 0
              fi
              echo "Production is not serving ${CIRCLE_SHA1} yet; retry ${attempt}/15"
              sleep 20
            done
            echo "Production did not expose the verified commit ${CIRCLE_SHA1}" >&2
            exit 1
          no_output_timeout: 10m

  automate-content:
    docker:
      - image: cimg/node:22.13
    resource_class: small
    working_directory: ~/zikr
    steps:
      - checkout
      - run:
          name: Install rendering tools
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core
      - run:
          name: Enable pnpm
          command: |
            sudo corepack enable
            corepack prepare pnpm@9.15.0 --activate
      - restore_cache:
          keys:
            - zikr-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - zikr-pnpm-v1-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Validate automation environment
          shell: bash
          command: |
            set -euo pipefail
            for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_ANON_KEY NEXT_PUBLIC_SITE_URL; do
              if [[ -z "${!name:-}" ]]; then
                echo "Missing required CircleCI project environment variable: ${name}" >&2
                exit 1
              fi
            done
      - run:
          name: Run autonomous content and publishing queues
          environment:
            VIDEO_GENERATOR: template
            AUTO_VIDEO_ENABLED: "true"
            AUTO_VIDEO_BATCH_SIZE: "1"
            VIDEO_BACKGROUND_BATCH_SIZE: "1"
            SOCIAL_BACKGROUND_BATCH_SIZE: "10"
            BACKGROUND_JOB_TARGET: all
          command: pnpm automation:run
          no_output_timeout: 15m

workflows:
  verify-on-change:
    jobs:
      - verify
      # Production smoke must run only after a main-branch deployment.
      # On pull requests, CIRCLE_SHA1 is not the production commit and the
      # comparison would fail even when the application is healthy.
      - production-smoke:
          requires:
            - verify
          filters:
            branches:
              only: main

  scheduled-automation:
    when: << pipeline.parameters.run_automation >>
    jobs:
      - automate-content
