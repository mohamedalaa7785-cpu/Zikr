project_id = "zikr"

[api]
enabled = true
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "env(NEXT_PUBLIC_SITE_URL)"
# AUTH_CALLBACK_URL is resolved from the environment (defaults to the
# production origin — see lib/env.ts). Only localhost is hardcoded for dev.
additional_redirect_urls = [
  "env(AUTH_CALLBACK_URL)",
  "http://localhost:3000/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Storage is disabled — the app uses AWS S3 via lib/services/s3.ts.
# Supabase storage is not used in this project.
[storage]
enabled = false

[functions.health]
verify_jwt = false

[functions.spiritual-ai]
verify_jwt = true
