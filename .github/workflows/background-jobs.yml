name: Background Jobs



on:

  schedule:
  
    - cron: "*/15 * * * *"
    
    - cron: "0 3 * * *"
    
  workflow_dispatch:
  
    inputs:
    
      target:
      
        description: "Queue to process"
        
        required: true
        
        default: "all"
        
        type: choice
        
        options:
        
          - all
          
          - videos
          
          - social
          


permissions:

  contents: read
  


concurrency:

  group: zikr-background-jobs-production
  
  cancel-in-progress: false
  


jobs:

  process:
  
    name: Process background queues
    
    runs-on: ubuntu-24.04
    
    timeout-minutes: 15
    
    env:
    
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      
      HEYGEN_AVATAR_ID: ${{ secrets.HEYGEN_AVATAR_ID }}
      
      HEYGEN_VOICE_ID: ${{ secrets.HEYGEN_VOICE_ID }}
      
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      
      BACKGROUND_JOB_TARGET: ${{ inputs.target || 'all' }}
      
    steps:
    
      - name: Check out repository
      
        uses: actions/checkout@v4
        


      - name: Set up Node.js
      
        uses: actions/setup-node@v4
        
        with:
        
          node-version: 22
          
          cache: pnpm
          


      - name: Enable pnpm
      
        run: corepack enable
        


      - name: Install dependencies
      
        run: pnpm install --frozen-lockfile
        


      - name: Validate required secrets
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SITE_URL; do
          
            if [[ -z "${!name:-}" ]]; then
            
              echo "Missing required secret: ${name}" >&2
              
              exit 1
              
            fi
            
          done
          


      - name: Run background queues
      
        run: pnpm background:jobs
        




























































