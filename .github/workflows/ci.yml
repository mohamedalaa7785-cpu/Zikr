name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase:migrations:check
      - run: node --check scripts/check-supabase-migrations.mjs
      - name: Check workflow files
        run: |
          test -s .github/workflows/background-jobs.yml
          test -s .github/workflows/ci.yml
          grep -Rni 'SUPABASE_SERVICE_ROLE_KEY:.*secrets.SUPABASE_SERVICE_ROLE_KEY' .github/workflows >/dev/null
      - run: pnpm imports:check
      - run: pnpm routes:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm build
