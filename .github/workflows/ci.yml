name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - production-recovery-plan

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck and build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://zikr.app
      AUTH_CALLBACK_URL: https://zikr.app/auth/callback
      NEXT_PUBLIC_SITE_NAME: زكر
      # Supabase — public-safe stubs; real values come from Vercel env.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
      # AI — stubs so build doesn't fail on key-discovery logic
      GEMINI_MODEL: gemini-2.0-flash
      GEMINI_API_KEY_2: placeholder-gemini-key
      AI_GATEWAY_API_KEY: placeholder-gateway-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Production build
        run: pnpm build
