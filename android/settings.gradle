include ':app'

def capacitorRoot = new File('../node_modules/@capacitor/android/capacitor')
def capacitorCordovaRoot = new File('../node_modules/@capacitor/android/capacitor-cordova-android-plugins')

if (capacitorRoot.exists()) {
    include ':capacitor-android'
    project(':capacitor-android').projectDir = capacitorRoot
}

if (capacitorCordovaRoot.exists()) {
    include ':capacitor-cordova-android-plugins'
    project(':capacitor-cordova-android-plugins').projectDir = capacitorCordovaRoot
}
